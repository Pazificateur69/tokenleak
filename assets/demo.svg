<text x="20" y="215"><tspan>  big-read           17      153.2k    13.7%   </tspan><tspan fill="#8b949e">Locate, then read: grep -n first, then read only that range</tspan></text>
<text x="20" y="234"><tspan>  wide-search         4       11.4k     0.9%   </tspan><tspan fill="#8b949e">Narrow searches: scope path/type, cap results, -l for names only</tspan></text>
<text x="20" y="253"><tspan>  noisy-shell         4       10.0k     0.9%   </tspan><tspan fill="#8b949e">Bound every command: quiet flags, `&gt; log; tail -n 40 log`, grep the log</tspan></text>
