<text x="20" y="386"><tspan>   2    1.0%  </tspan><tspan fill="#f3f99d">big-read     </tspan><tspan> Read shopcart/catalog.py                        </tspan><tspan fill="#8b949e">11.6k tok × 9 later calls</tspan><tspan>  </tspan><tspan fill="#8b949e">add-feature-baseline-1 · 2f63434b</tspan></text>
<text x="20" y="405"><tspan>   3    0.9%  </tspan><tspan fill="#f3f99d">big-read     </tspan><tspan> Read shopcart/catalog.py                        </tspan><tspan fill="#8b949e">11.6k tok × 8 later calls</tspan><tspan>  </tspan><tspan fill="#8b949e">add-feature-baseline-3 · fdc877ce</tspan></text>
<text x="20" y="424"><tspan>   4    0.9%  </tspan><tspan fill="#f3f99d">big-read     </tspan><tspan> Read shopcart/catalog.py                        </tspan><tspan fill="#8b949e">11.6k tok × 7 later calls</tspan><tspan>  </tspan><tspan fill="#8b949e">add-feature-baseline-2 · b61023fa</tspan></text>
<text x="20" y="443"><tspan>   5    0.9%  </tspan><tspan fill="#f3f99d">big-read     </tspan><tspan> Read shopcart/catalog.py                        </tspan><tspan fill="#8b949e">11.6k tok × 6 later calls</tspan><tspan>  </tspan><tspan fill="#8b949e">add-feature-baseline-4 · 39130531</tspan></text>
