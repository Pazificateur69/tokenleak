<text x="20" y="158"><tspan>  </tspan><tspan font-weight="bold">LEAK SCORE</tspan><tspan>  </tspan><tspan font-weight="bold" fill="#f3f99d">15.8%</tspan><tspan>  grade </tspan><tspan font-weight="bold" fill="#f3f99d">C</tspan><tspan>   </tspan><tspan fill="#8b949e">% of token cost that was avoidable · A&lt;5 B&lt;10 C&lt;20 D&lt;30</tspan></text>
