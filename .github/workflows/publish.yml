name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    if: vars.PYPI_PUBLISH == 'true'  # set once the PyPI trusted publisher exists, see CONTRIBUTING.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -q
      - run: python -m pip install build
      - run: python -m build
      # PyPI versions are immutable: refuse a tag that doesn't match tokenleak.__version__
      - run: test -f "dist/tokenleak-${GITHUB_REF_NAME#v}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tokenleak/
    permissions:
      id-token: write  # Trusted Publishing (OIDC), no API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
