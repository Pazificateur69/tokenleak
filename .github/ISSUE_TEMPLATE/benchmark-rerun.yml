name: Benchmark rerun
description: You reran bench/run.py on your account. Share the numbers, whatever they say
title: "Benchmark rerun: "
body:
  - type: markdown
    attributes:
      value: How to run and export, and the expected cost, are in [REPRODUCE.md](https://github.com/Pazificateur69/tokenleak/blob/main/REPRODUCE.md). A rerun that contradicts the README is the most useful kind.
  - type: input
    id: model
    attributes:
      label: Model
      description: The `Model:` line of your summary.md (full id, not the alias)
      placeholder: claude-sonnet-5
    validations:
      required: true
  - type: input
    id: arms
    attributes:
      label: Arms (`--variants`)
      placeholder: baseline,tokenleak,guard
    validations:
      required: true
  - type: input
    id: tasks
    attributes:
      label: Tasks (`--tasks`)
      placeholder: fix-test,find-answer,fix-build,add-feature
    validations:
      required: true
  - type: input
    id: runs
    attributes:
      label: Runs per task and arm (`--runs`)
      placeholder: "5"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Harness commit
      description: "`git rev-parse --short HEAD` in your clone. Say below if you changed anything in bench/."
      placeholder: 72657c0
    validations:
      required: true
  - type: input
    id: results
    attributes:
      label: Link to the results
      description: A PR adding the exported folder, a branch, or a .zip of it attached to this issue. Exported with `--export`, never the raw folder.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Claude Code version and OS
      placeholder: Claude Code 2.1 on macOS 15
  - type: textarea
    id: summary
    attributes:
      label: Your summary.md
      description: Paste the whole file.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything unusual?
      description: Failed or escaped runs, reruns, API errors, what you changed in the harness.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I shared the `--export` copy, and `grep -rl "$USER" <folder>` prints nothing.
          required: true
