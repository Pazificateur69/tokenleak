name: My before/after
description: Your own sessions before and after installing tokenleak, from `tokenleak --compare`
title: "Before/after: "
body:
  - type: markdown
    attributes:
      value: "Wait a week or more after installing, then run `tokenleak --compare <install date> --redact`. Details: [REPRODUCE.md](https://github.com/Pazificateur69/tokenleak/blob/main/REPRODUCE.md#measure-it-on-your-own-sessions). No change, or worse, is worth reporting too."
  - type: input
    id: dates
    attributes:
      label: Dates
      description: The date you passed to `--compare`, and the "sessions from" date the table prints.
      placeholder: --compare 2026-10-06, sessions from 2026-09-29
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1 / Codex CLI 0.15
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model(s) you mostly used
      placeholder: claude-sonnet-5
    validations:
      required: true
  - type: input
    id: installed
    attributes:
      label: What you installed or changed on that date
      placeholder: tokenleak plugin 1.8.2 / the rules in AGENTS.md / autoCompactWindow 300000
    validations:
      required: true
  - type: input
    id: leak_before
    attributes:
      label: Leak score before
      placeholder: 18.4% C
    validations:
      required: true
  - type: input
    id: leak_after
    attributes:
      label: Leak score after
      placeholder: 9.7% B
    validations:
      required: true
  - type: input
    id: cpc_before
    attributes:
      label: Cost per call before
      placeholder: 41.2k
    validations:
      required: true
  - type: input
    id: cpc_after
    attributes:
      label: Cost per call after
      placeholder: 33.5k
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      description: The `tokenleak --compare <date> --redact` table. The `--json --redact` output is welcome too, attached as a file.
      render: text
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: What else changed in that period?
      description: Model switch, other tools (rtk, caveman...), different projects or kind of work. The task mix differs between periods, so this matters.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I ran it with `--redact` and read the output, and it shows no paths, commands or project names.
          required: true
